# Atualizações de dependências (pilar 8.4). Correções de segurança abrem PR na hora;
# as demais, uma vez por semana e agrupadas para não encher a fila.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: gomod
    directory: /experiments/whatsapp-chamada
    schedule: { interval: monthly }
