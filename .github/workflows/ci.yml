name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omni
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d omni"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CI: "true"
      PGPASSWORD: postgres_ci
      OMNI_OWNER_PASSWORD: omni_owner_dev
      OMNI_APP_PASSWORD: omni_app_dev
      OMNI_WORKER_PASSWORD: omni_worker_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Falha conhecida alta ou crítica nas dependências de produção barra o merge (pilar 8.4).
      - name: Auditar dependências
        run: npm audit --omit=dev --audit-level=high

      - name: Preparar papéis e banco de teste
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          export POSTGRES_USER=postgres POSTGRES_DB=omni PGHOST=localhost PGPORT=5433
          sh deploy/postgres/init/01-roles.sh
          psql -v ON_ERROR_STOP=1 -U postgres -d omni -f deploy/postgres/dev/02-test-db.sql

      # O build gera apps/web/src/routeTree.gen.ts, necessário para a checagem de tipos.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Ponta a ponta (E18): o build de produção do web, com o login de desenvolvimento e a CSP
      # bloqueando (e2e/ambiente.env), no banco "omni" do serviço. Erro de JS ou violação de CSP
      # em qualquer tela barra o merge.
      - name: Ponta a ponta
        env:
          DATABASE_URL_OWNER: postgres://omni_owner:omni_owner_dev@localhost:5433/omni
          DATABASE_URL_APP: postgres://omni_app:omni_app_dev@localhost:5433/omni
          DATABASE_URL_WORKER: postgres://omni_worker:omni_worker_dev@localhost:5433/omni
          APP_ORIGIN: http://localhost:3000
          PORT: "3000"
          E2E_URL: http://localhost:3000
        run: |
          npx playwright install --with-deps chromium >/dev/null
          npm run db:migrate
          (set -a; . e2e/ambiente.env; set +a; exec node apps/web/.output/server/index.mjs) > e2e-servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null "$E2E_URL/api/saude" && break; sleep 1; done
          curl -sf "$E2E_URL/api/saude"
          npm run e2e
      - name: Log do servidor (ponta a ponta)
        if: failure()
        run: tail -n 200 e2e-servidor.log || true
