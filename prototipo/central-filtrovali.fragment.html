<title>Central Filtrovali</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: trilho de módulos | lista unificada de conversas | conversa (WhatsApp + e-mail + chamadas) | painel do cliente (Prisma, SharePoint, Foco) */
:root{
  --bg:#E8E8E8; --panel:#ffffff; --panel-2:#f4f4f4; --hover:#eeeeee; --line:#dcdcdc;
  --ink:#1b211d; --muted:#5f6661; --faint:#9a9fa0;
  --brand:#30503A; --brand-2:#243d2c; --brand-soft:#e2eae4; --on-brand:#ffffff;
  --wa:#30503A; --wa-soft:#e2eae4; --mail:#11437E; --mail-soft:#e3ebf5;
  --note:#6f6585; --note-soft:#efedf3; --rec:#C81519; --rec-soft:#fbe6e7; --lilac:#9B93A8;
  --chat-bg:#E8E8E8; --chat-dot:rgba(48,80,58,.07); --bubble-in:#ffffff; --bubble-out:#dfe9e2;
  --shadow:0 12px 40px rgba(20,30,24,.16);
  --font:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1210; --panel:#171b18; --panel-2:#1d221e; --hover:#232923; --line:#2c332e;
  --ink:#E8E8E8; --muted:#a0a7a2; --faint:#6f7672;
  --brand:#30503A; --brand-2:#243d2c; --brand-soft:#22342a; --on-brand:#ffffff;
  --wa:#8fbf9d; --wa-soft:#22342a; --mail:#8bb0e0; --mail-soft:#16243a;
  --note:#c3bcd0; --note-soft:#27242e; --rec:#ff6b6e; --rec-soft:#3a1719; --lilac:#9B93A8;
  --chat-bg:#111512; --chat-dot:rgba(232,232,232,.04); --bubble-in:#1c221e; --bubble-out:#26402f;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1210; --panel:#171b18; --panel-2:#1d221e; --hover:#232923; --line:#2c332e;
  --ink:#E8E8E8; --muted:#a0a7a2; --faint:#6f7672;
  --brand:#30503A; --brand-2:#243d2c; --brand-soft:#22342a; --on-brand:#ffffff;
  --wa:#8fbf9d; --wa-soft:#22342a; --mail:#8bb0e0; --mail-soft:#16243a;
  --note:#c3bcd0; --note-soft:#27242e; --rec:#ff6b6e; --rec-soft:#3a1719; --lilac:#9B93A8;
  --chat-bg:#111512; --chat-dot:rgba(232,232,232,.04); --bubble-in:#1c221e; --bubble-out:#26402f;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
.conclude{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--wa);flex:none}
.conclude:hover{background:var(--wa-soft);border-color:var(--wa)}
.conclude svg{width:16px;height:16px}
.conclude.reopen{color:var(--muted)}
.done-hint{display:flex;align-items:center;gap:8px;background:var(--wa-soft);border-radius:9px;padding:6px 6px 6px 10px;margin-bottom:8px;font-size:12px}
.done-hint>svg{width:16px;height:16px;color:var(--wa)}
.done-hint span{flex:1;min-width:0}
.pill.done{background:var(--panel-2);color:var(--muted);border:1px solid var(--line);height:17px;margin-right:6px;text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;border-radius:4px;padding:0 5px}
.link-done{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;color:var(--muted);font-size:12px;font-weight:500}
.link-done:hover{color:var(--ink);background:var(--hover)}
.link-done svg{width:15px;height:15px}
.all-clear{padding:48px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.all-clear .big{width:56px;height:56px;border-radius:50%;background:var(--wa-soft);color:var(--wa);display:grid;place-items:center}
.all-clear .big svg{width:28px;height:28px}
.all-clear b{color:var(--ink);font-size:14px;font-weight:600}
.chip .n{font-size:10.5px;opacity:.75}
.stream>*{flex-shrink:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--mail);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{height:100%;display:grid;grid-template-columns:64px 340px minmax(0,1fr) 0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app.info-open{grid-template-columns:64px 340px minmax(0,1fr) 370px}

/* Rail */
.rail{background:var(--brand);color:#cfe0d4;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.logo{width:42px;height:42px;display:grid;place-items:center;margin-bottom:10px}
.logo img{width:40px;height:40px}
.av.grp svg{width:52%;height:52%;color:#fff}
.rail-btn{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#b9cfc0}
.rail-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.rail-btn.on{background:rgba(255,255,255,.14);color:#fff}
.rail-btn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#fff;color:var(--brand);font-size:10px;font-weight:700;display:grid;place-items:center}
.rail-btn[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#111;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:50}
.rail .spacer{flex:1}
.me{width:36px;height:36px;border-radius:50%;background:#E8E8E8;color:#30503A;font-weight:600;display:grid;place-items:center;font-size:13px;border:2px solid #9B93A8}

/* List pane */
.list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.list-head{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
.list-title{display:flex;align-items:center;justify-content:space-between}
.list-title h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.2px}
.proto{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--note);background:var(--note-soft);padding:3px 8px;border-radius:20px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:38px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
:root[data-theme="dark"] .chip.on{color:#8fbf9d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{color:#8fbf9d}}
.line-select{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.line-select select{flex:1;min-width:0;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 8px;font-size:12px}
.list-body{flex:1;overflow-y:auto;min-height:0}
.row{display:flex;gap:12px;padding:10px 16px;align-items:center;cursor:pointer;border-bottom:1px solid var(--line);position:relative;width:100%;text-align:left}
.row:hover{background:var(--hover)}
.swipe-wrap{position:relative;overflow:hidden;transition:height .2s ease}
.swipe-wrap.collapse{height:0!important}
.swipe-bg{position:absolute;inset:0;background:var(--lilas);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:24px;font-weight:600;font-size:13px;transition:background .15s}
.swipe-bg span{display:inline-flex;align-items:center;gap:6px}
.swipe-wrap.armed .swipe-bg{background:var(--brand)}
.row{background:var(--panel)}
.row.swipeable{touch-action:pan-y;transition:transform .2s ease}
.row.swipeable.dragging{transition:none}
.swipe-hint{display:flex;align-items:center;gap:8px;margin:0 16px 8px;padding:8px 10px;border-radius:9px;background:var(--brand-soft);font-size:12px;color:var(--ink)}
.swipe-hint>svg{width:15px;height:15px;color:var(--brand)}
.swipe-hint span{flex:1}
.swipe-hint button{display:grid;place-items:center;color:var(--muted)}
.swipe-hint button svg{width:14px;height:14px}
.row.on{background:var(--brand-soft)}
.row .meta{flex:1;min-width:0}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{font-size:11px;color:var(--muted);flex:none}
.row .time.new{color:var(--brand);font-weight:600}
.row .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .prev{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;min-width:0}
.row .prev span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row .badge{background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;flex:none}
.ch-ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;flex:none}
.ch-ic svg{width:12px;height:12px}
.ch-ic.wa{background:var(--wa-soft);color:var(--wa)}
.ch-ic.mail{background:var(--mail-soft);color:var(--mail)}
.ch-ic.call{background:var(--rec-soft);color:var(--rec)}
.ch-ic.note{background:var(--note-soft);color:var(--note)}
.ch-ic.ev{background:var(--brand-soft);color:var(--brand)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;font-size:14px}
.av.sm{width:30px;height:30px;font-size:11px}
.av.xs{width:22px;height:22px;font-size:9.5px}
.section-label{padding:12px 16px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:10.5px;font-weight:600;white-space:nowrap}
.pill.stage{background:var(--mail-soft);color:var(--mail)}
.pill.won{background:var(--wa-soft);color:var(--wa)}
.pill.warn{background:var(--note-soft);color:var(--note)}
.pill.rec{background:var(--rec-soft);color:var(--rec)}

/* Chat */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chat-bg);position:relative}
.chat-head{height:60px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px 0 16px}
.chat-head .who{flex:1;min-width:0;cursor:pointer}
.chat-head .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn.on{color:var(--brand);background:var(--brand-soft)}
.back{display:none}
.stream{flex:1;overflow-y:auto;padding:18px 6% 12px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(var(--chat-dot) 1.2px,transparent 1.2px);background-size:18px 18px;min-height:0}
.day{align-self:center;background:var(--panel);color:var(--muted);font-size:11.5px;padding:4px 12px;border-radius:8px;margin:10px 0 4px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.msg{max-width:min(560px,78%);padding:7px 10px 5px;border-radius:10px;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.06);word-wrap:break-word}
.msg.in{align-self:flex-start;background:var(--bubble-in);border-top-left-radius:3px}
.msg.out{align-self:flex-end;background:var(--bubble-out);border-top-right-radius:3px}
.msg .from{font-size:12px;font-weight:600;margin-bottom:2px}
.msg .foot{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);margin-top:2px}
.msg .foot svg{width:15px;height:15px}
.msg .foot .read{color:var(--mail)}
.msg .via{display:inline-flex;align-items:center;gap:3px;margin-right:auto;font-size:10px}
.msg .via svg{width:11px;height:11px}
.file-chip{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.04);border-radius:8px;padding:8px 10px;margin:4px 0;min-width:220px}
:root[data-theme="dark"] .file-chip{background:rgba(255,255,255,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .file-chip{background:rgba(255,255,255,.05)}}
.file-chip .ext{width:34px;height:40px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;flex:none}
.file-chip b{display:block;font-size:12.5px;font-weight:500;word-break:break-all}
.file-chip small{color:var(--muted);font-size:11px}
.card{align-self:center;width:min(600px,100%);background:var(--panel);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.07);overflow:hidden;margin:4px 0;border:1px solid var(--line)}
.card.out{align-self:flex-end}
.card.in{align-self:flex-start}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.card-h b{color:var(--ink);font-weight:600}
.card-h .r{margin-left:auto;white-space:nowrap}
.card-b{padding:10px 12px}
.card .subj{font-weight:600;margin-bottom:4px}
.card .body{white-space:pre-line;color:var(--ink)}
.card .body.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{background:var(--rec);color:#fff;border-color:transparent}
.mail-card{border-left:3px solid var(--mail)}
.call-card{border-left:3px solid var(--rec)}
.meet-card{border-left:3px solid var(--lilac)}
.player{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:10px;padding:8px 10px}
.player .play{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.player .play svg{width:13px;height:13px;fill:currentColor}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:26px;min-width:0;overflow:hidden}
.wave i{width:3px;border-radius:2px;background:var(--faint);flex:none}
.wave i.p{background:var(--brand)}
.summary{background:var(--brand-soft);border-radius:10px;padding:9px 12px;margin-top:8px}
.summary h4{margin:0 0 4px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;color:var(--brand)}
:root[data-theme="dark"] .summary h4{color:#8fbf9d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .summary h4{color:#8fbf9d}}
.summary h4 svg{width:13px;height:13px}
.summary ul{margin:0;padding-left:18px}
.transcript{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.transcript p{margin:0;font-size:12.5px}
.transcript p b{font-weight:600}
.transcript .ts{color:var(--faint);font-family:var(--mono);font-size:10.5px;margin-right:6px}
.event{align-self:center;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:16px;max-width:100%;margin:3px 0}
.event b{color:var(--ink);font-weight:500}
.event svg{width:13px;height:13px;color:var(--brand)}
.note-msg{align-self:flex-end;max-width:min(520px,78%);background:var(--note-soft);border:1px dashed var(--note);border-radius:10px;padding:7px 10px;font-size:13px}
.note-msg .lab{font-size:10.5px;font-weight:600;color:var(--note);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:4px}
.note-msg .lab svg{width:12px;height:12px}
.highlight{animation:hl 2.2s ease}
@keyframes hl{0%,40%{box-shadow:0 0 0 3px var(--wa)}100%{box-shadow:0 0 0 0 transparent}}
.typing{align-self:flex-start;background:var(--bubble-in);padding:8px 14px;border-radius:10px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3}30%{opacity:1}}

.drop-veil{position:absolute;inset:60px 0 0 0;background:color-mix(in srgb,var(--wa) 14%,transparent);border:3px dashed var(--wa);border-radius:14px;margin:10px;display:grid;place-items:center;font-weight:600;color:var(--wa);pointer-events:none;z-index:5;font-size:15px}

/* Composer */
.composer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px 10px;position:relative}
.ch-switch{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.seg button svg{width:13px;height:13px}
.seg button.on[data-ch="wa"]{background:var(--wa);color:#fff}
.seg button.on[data-ch="mail"]{background:var(--mail);color:#fff}
.seg button.on[data-ch="note"]{background:var(--note);color:#fff}
.ch-hint{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.mail-fields{padding-left:4px;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin-bottom:6px;font-size:12px}
.mail-fields label{color:var(--muted)}
.mail-fields input{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:0 8px;min-width:0;width:100%}
.input-row{display:flex;align-items:flex-end;gap:6px}
.input-row textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 12px;max-height:140px;min-height:40px;outline:none;line-height:1.4}
.input-row textarea:focus{border-color:var(--brand)}
.send{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.send:hover{background:var(--brand-2)}
.attach-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.att{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 8px;font-size:12px;max-width:100%}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.att button{display:grid;place-items:center;color:var(--muted)}
.att button svg{width:14px;height:14px}
.task-preview{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-size:12px;background:var(--brand-soft);border-radius:8px;padding:6px 8px}
.task-preview .tk{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border-radius:6px;padding:2px 7px;font-weight:500;font-size:11.5px}
.task-preview .ttl{font-weight:600}

/* Info pane */
.info{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.app:not(.info-open) .info{display:none}

.tabs{display:flex;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tabs button{flex:1;height:40px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tabs button svg{width:14px;height:14px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
:root[data-theme="dark"] .tabs button.on{color:#8fbf9d;border-bottom-color:#8fbf9d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button.on{color:#8fbf9d;border-bottom-color:#8fbf9d}}
.info-body{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.block{border:1px solid var(--line);border-radius:12px;padding:12px}
.block h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.block h3 .src{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-size:10.5px;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:6px 0 2px}
.profile .av{width:72px;height:72px;font-size:24px}
.profile b{font-size:16px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.copy-line{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.copy-line:last-child{border-bottom:0}
.copy-line svg{color:var(--muted);width:16px;height:16px}
.copy-line span{flex:1;min-width:0;overflow-wrap:anywhere}
.copy-line button{font-size:11px;color:var(--muted);padding:2px 6px;border-radius:5px}
.copy-line button:hover{background:var(--hover)}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:8px 0 4px}
.pipeline i{height:6px;border-radius:3px;background:var(--line)}
.pipeline i.done{background:var(--brand)}
.pipeline i.cur{background:var(--mail)}
.pipe-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--faint)}
.big-num{font-size:22px;font-weight:600;letter-spacing:-.4px}
.opp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.opp-head .code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.opp-head b{display:block;font-weight:600;line-height:1.3}
.list-mini{display:flex;flex-direction:column}

.list-mini .it .g{flex:1;min-width:0}
.list-mini .it .g b{font-weight:500;display:block}
.list-mini .it .g small{color:var(--muted);font-size:11px}
.list-mini .it .v{text-align:right;font-size:12px;white-space:nowrap}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}

.crumbs button:last-child{color:var(--ink)}
.fs-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;cursor:pointer;user-select:none;width:100%;text-align:left}

.fs-item .fi{width:30px;height:34px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}

.fs-item .fi.folder svg{width:26px;height:26px;fill:#f1c34e;stroke:#c9961a}
.fs-item .g{flex:1;min-width:0}
.fs-item .g b{display:block;font-weight:500;font-size:12.5px;overflow-wrap:anywhere}
.fs-item .g small{color:var(--muted);font-size:11px}
.fs-item .send-mini{opacity:0;font-size:11px;color:var(--wa);font-weight:600;white-space:nowrap}
.fs-item:hover .send-mini{opacity:1}
.fs-item.suggest{background:var(--wa-soft)}
.tip{font-size:11.5px;color:var(--muted);background:var(--panel-2);border-radius:9px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start}

.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}

.task.done .ck svg{opacity:1}
.task.done .g b{text-decoration:line-through;color:var(--muted)}
.task .g{flex:1;min-width:0}
.task .g b{font-weight:500;display:block;font-size:12.5px}
.task .g .m{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:2px;align-items:center}
.task .g .m .due{color:var(--wa);font-weight:500}
.task .g .m .due.late{color:#d1453b}
.quick-task{display:flex;gap:6px}
.quick-task input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:0 10px;font-size:12.5px}
.journey{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:14px}
.journey::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.journey .st{position:relative}
.journey .st::before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--brand)}
.journey .st.won::before{background:var(--wa);border-color:var(--wa)}
.journey .st.cur::before{background:var(--mail);border-color:var(--mail)}
.journey .st small{color:var(--muted);font-size:11px;font-family:var(--mono)}
.journey .st b{display:block;font-weight:500;font-size:12.5px}
.journey .st p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel-2);border-radius:9px;padding:8px;text-align:center}
.stats b{display:block;font-size:16px;font-weight:600}
.stats small{font-size:10.5px;color:var(--muted)}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(8,14,10,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h b{flex:1;font-size:15px;font-weight:600}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sec-item{display:flex;gap:12px;align-items:flex-start}
.sec-item .si{width:34px;height:34px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .sec-item .si{color:#8fbf9d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec-item .si{color:#8fbf9d}}
.sec-item b{display:block;font-weight:600;font-size:13px}
.sec-item p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.call-screen{background:linear-gradient(180deg,#30503A,#18281d);color:#fff;border-radius:20px;width:min(360px,100%);padding:30px 24px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:var(--shadow)}
.call-screen .av{width:92px;height:92px;font-size:30px;border:3px solid rgba(255,255,255,.25)}
.call-screen h2{margin:6px 0 0;font-size:19px;font-weight:600}
.call-screen .timer{font-family:var(--mono);font-size:15px;opacity:.85}
.rec-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(207,16,29,.25);color:#ffb3b8;border-radius:14px;padding:4px 10px;font-size:11.5px;font-weight:600}
.rec-badge i{width:8px;height:8px;border-radius:50%;background:#ff4d57;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.call-screen .consent{font-size:11px;opacity:.65;max-width:260px}
.call-actions{display:flex;gap:18px;margin-top:14px}
.call-actions button{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.call-actions button.on{background:#fff;color:#30503A}
.call-actions button.end{background:#C81519}
.call-actions button.end svg{transform:rotate(135deg)}
.live-tx{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;font-size:12px;text-align:left;width:100%;min-height:48px;opacity:.9}
.live-tx small{display:block;opacity:.6;font-size:10.5px;margin-bottom:2px}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70;width:min(360px,calc(100% - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.toast .g{flex:1;min-width:0}
.toast .g b{display:block;font-weight:600;font-size:12.5px}
.toast .g p{margin:2px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.toast .acts{display:flex;gap:6px;margin-top:8px}
.modal.wide{width:min(1040px,100%)}
.modal-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--mail);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.fmt-row{display:flex;gap:6px;flex-wrap:wrap}
.batch-text{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px 12px;font:13px/1.55 var(--mono);color:var(--ink);outline:none}
.batch-text:focus{border-color:var(--brand)}
.batch-opts{display:grid;grid-template-columns:1fr 180px;gap:10px}
.batch-opts label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:500}
.batch-opts select,.batch-opts input,.brow input:not([type=checkbox]),.brow select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;font-size:12.5px;color:var(--ink);min-width:0;width:100%}
.warn-box{display:flex;gap:10px;background:var(--note-soft);border:1px solid var(--lilas);border-radius:10px;padding:10px 12px;font-size:12.5px}
.warn-box>svg{color:var(--note);margin-top:2px}
.warn-box ul{margin:4px 0 0;padding-left:18px}
.brows{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto}
.brow{display:grid;grid-template-columns:26px minmax(0,1fr) 190px 160px 140px 92px;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px}
.brow.bhead{border:0;padding:0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.brow.off{opacity:.5}
.brow.bad{border-color:var(--rec)}
.brow .miss{border-color:var(--rec)!important}
.brow .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.brow .bt small{font-size:10.5px;color:var(--muted)}
.sel-ck{width:18px;height:18px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.sel-bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.sel-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.sel-row{display:flex;gap:8px}
.sel-row select{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px}
.btn.on-sel{border-color:var(--brand);color:var(--brand)}
@media (max-width:860px){
  .brow.bhead{display:none}
  .brow{grid-template-columns:26px 1fr 1fr;grid-template-areas:"ck t t" ". p p" ". w w" ". d h"}
  .brow>span:nth-child(1){grid-area:ck}.brow>span:nth-child(2){grid-area:t}.brow>span:nth-child(3){grid-area:p}.brow>span:nth-child(4){grid-area:w}.brow>span:nth-child(5){grid-area:d}.brow>span:nth-child(6){grid-area:h}
  .batch-opts{grid-template-columns:1fr}
  .brows{max-height:none}
}

.stg-chip{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--mail-soft);color:var(--mail);font-size:11.5px;font-weight:600;white-space:nowrap;flex:none}

.stage-ev{align-self:center;width:min(520px,100%);display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1.5px dashed var(--lilas);border-radius:12px;padding:9px 12px;margin:3px 0}
.stage-ev .num{flex:none;min-width:40px;height:26px;border-radius:13px;background:var(--mail);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--mono)}

.badge.gerl{background:var(--mail)!important}
.ger-block{border-color:var(--mail)}

.seg button.on[data-ch="int"]{background:var(--note);color:var(--panel)}

function parseTask(raw){

  if(tm && +tm[1]<24){time=String(tm[1]).padStart(2,"0")+":"+(tm[2]||"00");rest=rest.replace(tm[0]," ");}
  const dm = rest.match(/\s(depois de amanh[ãa]|amanh[ãa]|hoje|(?:pr[óo]xim[ao]\s+)?(?:segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:-feira)?|\d{1,2}\/\d{1,2})(?=[\s,.])/i);
  if(dm){ const w=norm(dm[1]);
    if(w==="hoje") due=addDays(0); else if(w==="amanha") due=addDays(1); else if(w==="depois de amanha") due=addDays(2);
    else if(/\d/.test(w)){const [d,m]=w.split("/").map(Number);due=iso(new Date(2026,m-1,d));}
    else { const day=WEEK[w.replace(/^proxim[ao]\s+/,"").replace("-feira","")]; let n=(day-BASE.getDay()+7)%7; if(n===0) n=7; due=addDays(n); }
    rest=rest.replace(dm[0]," "); }
  if(due) tok.push(["task",fmtDue(due)+(time?" · "+time:"")]); else if(time){due=addDays(0);tok.push(["task","Hoje · "+time]);}
  const title = rest.replace(/\s+/g," ").trim();
  return {title,who,due,time,prio,project,tok};
}

function parseBatch(text,defProj,refIso){

function applyLabels(row,text,ref,warnings,i){

function parseRow(body,cur,ref,warnings,i){

    const p=matchPeople(cols[2]); row.who=p.length===1?p[0]:null; row.hint=cols[2]; row.group=null;

}

function batchCreate(){
  const B=S.batch; const on=B.rows.filter(r=>r.on); if(!on.length||on.some(rowInvalid)) return;
  const byConv={}, byWho={}, made=[];
  on.forEach(r=>{ const pj=projById(r.proj); const cid=pj.conv||B.conv||null;
    const nt={id:"t"+(uid++),title:r.title,who:r.who,due:r.due,time:r.time||null,prio:r.prio,done:false,conv:cid,project:pj.code||pj.name}; TASKS.push(nt); made.push(nt);
    if(cid){ (byConv[cid]=byConv[cid]||{}); byConv[cid][r.who]=(byConv[cid][r.who]||0)+1; }
    byWho[r.who]=(byWho[r.who]||0)+1; });
  Object.entries(byConv).forEach(([cid,w])=>{ const n=Object.values(w).reduce((a,b)=>a+b,0);
    push(conv(cid),{t:"event",ic:"task",text:`${n} tarefa${n>1?"s":""} criada${n>1?"s":""} em lote no Foco · ${Object.entries(w).map(([k,q])=>esc(memberName(k).split(" ")[0])+" ("+q+")").join(", ")}`,time:nowTime()}); });
  const byGroup=new Map(); made.forEach(t=>{const g=groupOfTask(t); if(g){ if(!byGroup.has(g)) byGroup.set(g,[]); byGroup.get(g).push(t);} });
  byGroup.forEach((list,g)=>notifyTasksCreated(g,list));
  const others=Object.keys(byWho).filter(k=>k!==ME);
  $("#overlay").innerHTML=""; S.batch.text=""; S.batch.rows=null;
  toast("task",`${on.length} tarefas criadas no Foco`, others.length?`${others.map(k=>memberName(k).split(" ")[0]+" ("+byWho[k]+")").join(", ")} ${others.length>1?"recebem":"recebe"} os avisos no sino e um e-mail com o resumo.`:"Todas ficaram com você.");
  renderAll(false);
}

// Calendário: a IA só envia de segunda a sexta, 8h às 18h, fora de feriados nacionais e municipais de Itajaí
const HOLIDAYS={"2026-01-01":"Ano-Novo","2026-04-03":"Sexta-feira Santa","2026-04-21":"Tiradentes","2026-05-01":"Dia do Trabalho","2026-06-04":"Corpus Christi (Itajaí)","2026-06-15":"Aniversário de Itajaí","2026-09-07":"Independência","2026-10-12":"Nossa Senhora Aparecida","2026-11-02":"Finados","2026-11-15":"Proclamação da República","2026-11-20":"Consciência Negra","2026-12-08":"Imaculada Conceição (Itajaí)","2026-12-25":"Natal","2027-01-01":"Ano-Novo"};
const WDL=["dom","seg","ter","qua","qui","sex","sáb"];
const pd = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const isBiz = d=>d.getDay()>0&&d.getDay()<6&&!HOLIDAYS[iso(d)];
const at8 = d=>{const x=new Date(d);x.setHours(8,0,0,0);return x;};
function nextSlot(dt){ let d=new Date(dt); if(isBiz(d)&&d.getHours()>=8&&d.getHours()<18) return d; if(isBiz(d)&&d.getHours()<8) return at8(d); d=at8(d); do{d.setDate(d.getDate()+1);}while(!isBiz(d)); return d; }
function prevBiz(dateStr,n=1){ let d=at8(pd(dateStr)); let k=0; while(k<n){ d.setDate(d.getDate()-1); if(isBiz(d)) k++; } return d; }

function agenda(c){
  const m=c.mission, P=m.plan, A=m.ai, out=[]; if(!P) return out;
  const add=(flow,when,label,why)=>out.push({flow,when,label,why,st:A[flow]||"sched"});
  const created=new Date(P.created); const f2=new Date(created.getTime()+2*3600e3); const slot=nextSlot(f2);
  const slotN=nextSlot(new Date(Math.max(slot,NOW)));
  if(m.creator&&!TEAM[m.creator].seller) add("creatorSeller",slot,`Perguntar a ${memberName(m.creator).split(" ")[0]} quem é o vendedor da carteira`,`o grupo foi criado por ${esc(memberName(m.creator).split(" ")[0])} (${TEAM[m.creator].role.toLowerCase()}), não por um vendedor`);
  add("sellerInfo",A.sellerInfo==="ok"||A.sellerInfo==="asked"?slot:slotN,"Pedir ao vendedor: proposta técnica, data de atendimento e contato do cliente",m.seller?`vendedor: ${esc(memberName(m.seller).split(" ")[0])}`:"depois de saber quem é o vendedor");
  add("docResp",slot,"Perguntar ao líder de projetos quem cuida da documentação","2 h após a criação do grupo");
  add("mobForecast",slot,"Pedir previsão de mobilização ao comercial",`2 h após a criação do grupo (${fmtDT(created)})${+slot!==+f2?" · fora do horário, vai para o próximo horário útil":""}`);
  if(!P.mob) return out;
  const sc=prevBiz(P.mob,5); add("stageCheck",sc,"Conferir etapas pendentes antes da mobilização","5 dias úteis antes da mobilização");
  const mc=prevBiz(P.mob,1); const sk=skipped(mc,pd(P.mob));
  add("mobConfirm",mc,`Confirmar mobilização de ${fmtD(P.mob)}`,`1 dia útil antes da mobilização${sk.length?" · pula "+sk.join(", "):""}${pd(P.mob).getDay()%6===0?" e o fim de semana":""}`);
  const startBase=P.startRetry?pd(P.startRetry):addDaysD(P.mob,P.travel||0); const st=bizOnOrAfter(startBase);
  add("startCheck",st,"Perguntar se a equipe começou a trabalhar em campo",P.startRetry?`nova data informada (${fmtD(P.startRetry)})`:`mobilização + ${P.travel} dia${P.travel===1?"":"s"} de viagem da proposta → 1º dia útil depois`);
  if(m.close){ const K=m.close;
    add("measureNotify",nextSlot(NOW),"Avisar o Sérgio para medir o término dos serviços","operação concluída pelo gerente do contrato");
    if(A.measureNotify==="asked"||A.measureCheck) add("measureCheck",bizOnOrAfter(addDaysD(iso(NOW),1)),"Perguntar ao Sérgio se já mediu","Sérgio não respondeu no dia: pergunta no dia útil seguinte");
    if(K.approvalDate) add("approvalCheck",at8(pd(K.approvalDate)),"Perguntar se o cliente aprovou a medição",`na data de aprovação informada pelo Sérgio (${fmtD(K.approvalDate)})`);
    if(K.nfAsk) add("nfRequest",nextSlot(new Date(Math.max(NOW,0))),"Pedir à Priscila a emissão da NF","missão liberada para faturamento");
    if(K.omieAsk) add("omieClose",at8(pd(K.omieAsk)),"Perguntar à Priscila se ainda há despesas ou pagamentos no Omie","para encerrar a missão de vez"); }
  if(m.arrFollow) add("arrivalFollow",at8(pd(m.arrFollow.date)),`Perguntar se ${m.arrFollow.names.map(n=>n.split(" ")[0]).join(" e ")} chegaram na obra`,"data de chegada informada pelo líder de projetos");
  if(!P.demob) return out;
  const dc=prevBiz(P.demob,1); add("demobConfirm",dc,`Confirmar desmobilização de ${fmtD(P.demob)}`,"1 dia útil antes da desmobilização");
  add("demobEquip",nextSlot(new Date(Math.max(dc,NOW))),"Perguntar se os equipamentos foram desmobilizados","logo depois da confirmação");
  const ar=bizOnOrAfter(addDaysD(P.demob,P.travel||0)); add("arrival",ar,"Confirmar chegada na sede e destino de cada colaborador",`desmobilização + ${P.travel||0} dia${P.travel===1?"":"s"} de viagem`);
  return out;
}

const NUMW={um:1,uma:1,dois:2,duas:2,"três":3,tres:3,quatro:4,cinco:5};
const STOPW=new Set(["quantos","quantas","cliente","liberando","informação","informacao","estiver","vindo","trabalhar","gente","sobre","quando","sempre","dentro","nossos","nossa","nosso","esta","está","estao","estão","dados","valor"]);
function parseRule(text,ch,c){
  const m=c.mission, t=text.replace(/^(@ia|\/alerta)\s*/i,"").trim();
  const src=/\brdos?\b/i.test(t)?"rdo":"rdo";
  const fm=t.match(/informa[cç][aã]o (?:de |do |da |sobre )?(.+?)(?:,|\.|;|$| para a gente| pra gente| para n[oó]s| por \w+ dias)/i);
  const field=(fm?fm[1]:t).trim();
  const nm=t.match(/(\d+|um|uma|dois|duas|tr[eê]s|quatro|cinco)\s+dias?/i); const n=nm?(+nm[1]||NUMW[norm(nm[1])]||2):2;
  const who=/gerente do contrato/i.test(t)?"manager":/l[ií]der de campo/i.test(t)&&!/l[ií]der de projetos/i.test(t)?"field":"leader";
  const chan=/gerencial/i.test(t)?"ger":/interno/i.test(t)?"int":ch;
  let keys=norm(field).split(/[^a-z0-9]+/).filter(w=>w.length>=5&&!STOPW.has(w)).slice(0,2).map(w=>w.replace(/(oes|ao|s)$/,"").slice(0,6));
  if(!keys.length) keys=[norm(field).slice(0,6)];
  return {id:"r"+(uid++),src,field,n,who,ch:chan,keys,active:false,by:ME,created:nowTime(),after:null,alerts:0,raw:t};
}
const ruleWho=(c,r)=>{ const m=c.mission; return r.who==="manager"?{k:m.manager,lab:"gerente do contrato"}:r.who==="field"?{k:null,name:m.field?m.field.n:"líder de campo",lab:"líder de campo"}:{k:m.leader||m.manager,lab:"líder de projetos"}; };

function checkRule(c,rule,silent){
  const L=(RDOS[c.id]||[]).slice().sort((a,b)=>a.n-b.n); if(!L.length) return false;
  if(rule.after==null) rule.after=L[L.length-1].n-rule.n;
  const fresh=L.filter(r=>r.n>rule.after); let streak=[];
  for(const r of fresh){ if(rdoHas(r,rule)) streak=[]; else streak.push(r); }
  rule.lastCheck=nowTime(); rule.lastRdo=L[L.length-1].n;
  if(streak.length>=rule.n){ const hit=streak.slice(-rule.n); rule.after=hit[hit.length-1].n; rule.alerts++;
    push(c,{t:"ralert",ch:rule.ch,rule:rule.id,rdos:hit.map(r=>r.n),time:nowTime(),round:rule.alerts});
    if(rule.ch==="ger") c.gerUnread=(c.gerUnread||0)+1; else c.intUnread=(c.intUnread||0)+1;
    S.notifs.unshift({conv:c.id,layer:rule.ch==="ger"?"ger":"int",text:`${c.name.split(" - ")[0]} · alerta: ${rule.field} não veio nos RDOs ${hit.map(r=>"nº "+r.n).join(" e ")}`,time:nowTime(),read:false});
    return true; }
  if(!silent) toast("spark","Verificação feita",`RDOs lidos até o nº ${rule.lastRdo}. ${streak.length?`${streak.length} de ${rule.n} RDO${rule.n>1?"s":""} seguidos sem a informação.`:"A informação apareceu."}`);
  return false;
}

function attachMailModal(){ const all=[]; CONVS.forEach(c=>c.items.forEach((x,i)=>{ if(x.t==="email"||x.t==="memail") all.push({c,x,i}); }));

  $("#amQ").addEventListener("input",e=>{ const q=norm(e.target.value); document.querySelectorAll(".am-it").forEach(b=>b.hidden=!b.dataset.q.includes(q)); }); $("#amQ").focus(); }
function bindMail(c){ const M=mailState(c);
  document.querySelectorAll(".rcp-in").forEach(inp=>{ const f=inp.dataset.f;
    inp.addEventListener("input",()=>{ $("#rcpSug").innerHTML=suggestHTML(searchContacts(inp.value).filter(x=>![...M.to,...M.cc,...M.bcc].includes(x.e)),f); });
    inp.addEventListener("keydown",e=>{ const v=inp.value.trim();
      if((e.key==="Enter"||e.key===","||e.key==="Tab")&&v){ e.preventDefault(); const first=$("#rcpSug .rcp-sug button"); const em=first?first.dataset.e:(/^\S+@\S+\.\S+$/.test(v)?v:null); if(em) addRcp(c,f,em); else toast("info","E-mail inválido","Escolha um contato ou digite um e-mail completo."); }
      if(e.key==="Backspace"&&!v&&M[f].length){ M[f].pop(); refreshComposer(); focusRcp(f); } }); });
  const sg=$("#sigOn"); if(sg) sg.addEventListener("change",()=>{ M.sig=sg.checked; refreshComposer(); });
}
function focusRcp(f){ const x=$("#rcp-"+f); if(x) x.focus(); }
function addRcp(c,f,e){ const M=mailState(c); ["to","cc","bcc"].forEach(k=>M[k]=M[k].filter(x=>x!==e)); M[f].push(e); refreshComposer(); focusRcp(f); }

/* ---------- Participantes da missão (cliente e terceiros), detectados em e-mails e WhatsApp, replicados no Prisma ---------- */
const GENERIC=/^(compras|reservas|seguranca|segurança|financeiro|contato|comercial|suprimentos|portaria|rh|nfe|fiscal)$/i;
const cap = w=>w.charAt(0).toUpperCase()+w.slice(1);
function nameFromEmail(e){ const loc=e.split("@")[0]; if(GENERIC.test(loc)) return null; return loc.split(/[._-]/).filter(Boolean).map(cap).join(" "); }
function companyOf(c,dom){ return c.mission.domains.includes(dom)?c.company:({hotelserraverde:"Hotel Serra Verde"})[dom.split(".")[0]]||dom.split(".")[0].replace(/^\w/,x=>x.toUpperCase()); }
function sigInfo(body,name){ if(!body||!name) return {}; const first=norm(name.split(" ")[0]); const line=body.split("\n").map(l=>l.trim()).find(l=>norm(l).startsWith(first)&&l.includes("·")); if(!line) return {};
  const parts=line.split("·").map(x=>x.trim()); return {full:parts[0],role:parts[1]&&!/filtrovali|terminais|ltda|s\.a\.|usina|metal|cervejaria/i.test(parts[1])?parts[1]:null}; }
function upsertPart(c,p){ const m=c.mission; m.parts=m.parts||[]; let ex=m.parts.find(x=>(p.email&&x.email===p.email)||(p.phone&&x.phone===p.phone)||(!x.generic&&!p.generic&&p.name&&norm(x.name)===norm(p.name)));
  if(ex){ ["name","role","phone","email"].forEach(k=>{ if(p[k]&&(!ex[k]||((k==="name"||k==="role")&&String(ex[k]).length<String(p[k]).length))) ex[k]=p[k]; }); if(!ex.srcs.includes(p.src)) ex.srcs.push(p.src); return null; }
  const n={...p,srcs:[p.src],prisma:{at:nowTime()},added:nowTime()}; m.parts.push(n); return n; }
function scanMail(c,it){ const m=c.mission; if(!m||it.t!=="memail") return []; const news=[];
  const addrs=[["from",it.from],...String(it.to||"").split(/,\s*/).map(x=>["to",x]),...String(it.cc||"").split(/,\s*/).map(x=>["cc",x])].filter(([,e])=>e&&e.includes("@")&&!e.endsWith("@filtrovali.com.br"));
  addrs.forEach(([how,e])=>{ const dom=e.split("@")[1], guess=nameFromEmail(e), si=how==="from"?sigInfo(it.body,guess):{};
    const p={email:e,name:si.full||guess||`${({seguranca:"Segurança do Trabalho",compras:"Compras",financeiro:"Financeiro",reservas:"Reservas"})[e.split("@")[0]]||cap(e.split("@")[0])} · ${companyOf(c,dom)}`,role:si.role||null,generic:!guess,company:companyOf(c,dom),kind:m.domains.includes(dom)?"Cliente":"Terceiro",src:`e-mail${how==="cc"?" (em cópia)":""}: “${it.subject}”`};
    const n=upsertPart(c,p); if(n) news.push(n); });
  return news; }

function scanWa(c){ const L=WA_SCAN[c.id]||[], news=[]; L.forEach(w=>{ const n=upsertPart(c,{name:w.name,role:w.role,phone:w.phone,company:c.company,kind:"Cliente",src:`WhatsApp de ${memberName(w.by).split(" ")[0]}: “${w.text.slice(0,60)}…”`}); if(n) news.push(n); }); return news; }
function partsHTML(c){ /* */ const m=c.mission; if(!m) return ""; const P=m.parts||[]; if(!P.length) return "";
  const cli=P.filter(p=>p.kind==="Cliente"), ter=P.filter(p=>p.kind!=="Cliente");

function visibleConvs(){

function conclude(id,fromList){
  const c=conv(id); if(!c) return;
  if(fromList){ S.swipeHintSeen=true; }
  if(fromList && (id!==S.active || window.innerWidth<=760)){
    c.archived=true; c.unread=0; delete S.replied[id];
    if(id===S.active){ const nx=visibleConvs().find(x=>!x.archived&&x.id!==id); if(nx) S.active=nx.id; }
    toast("check",c.mission?"Missão concluída":"Conversa concluída",c.name+(c.mission?" saiu de Todas e continua em Missões. Volta sozinha quando chegar algo novo.":" saiu da sua lista. Para achar de novo, use a busca."),`<button class="btn" data-act="undoConclude" data-id="${id}">Desfazer</button>`);
    if(window.innerWidth<=760) renderList(); else renderAll(false);
    return; }
  const order=visibleConvs().filter(x=>!x.archived); const idx=order.findIndex(x=>x.id===id);
  c.archived=true; c.unread=0; delete S.replied[id];
  const next=order.slice(idx+1).concat(order.slice(0,idx)).find(x=>!x.archived);
  toast("check",c.mission?"Missão concluída":"Conversa concluída",c.name+(c.mission?" saiu de Todas e continua em Missões. Volta sozinha quando chegar algo novo.":" saiu da sua lista. Para achar de novo, use a busca."),`<button class="btn" data-act="undoConclude" data-id="${id}">Desfazer</button>`);
  if(window.innerWidth<=760||!next){ S.pane="list"; if(next) S.active=next.id; renderAll(); return; }
  S.active=next.id; next.unread=0; S.attach=[]; renderAll();
}

const SLASH=[["/tarefa","Criar tarefa no Foco","/tarefa "],["/lote","Criar e delegar várias tarefas","/lote"],["/alerta","Criar alerta da IA só para esta missão","/alerta "],["/proposta","Anexar a última proposta","/proposta"],["/modelo","Inserir modelo de resposta","/modelo"],["/nota","Escrever nota interna","/nota "]];
function bindComposer(c){
  const ta=$("#msg"); if(!ta) return;
  const grow=()=>{ta.style.height="auto";ta.style.height=Math.min(140,ta.scrollHeight)+"px";};
  grow();
  const upd=()=>{ S.drafts[c.id]=ta.value; grow(); updateHelpers(); };
  ta.addEventListener("input",upd);
  ta.addEventListener("keydown",e=>{
    const sl=$("#slash"); const open=sl&&sl.innerHTML;
    if(open&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();S.slashSel=(S.slashSel+(e.key==="ArrowDown"?1:-1)+SLASH.length)%SLASH.length;updateHelpers();return;}
    const mo=$("#mentSug")&&$("#mentSug").innerHTML;
    if(mo&&(e.key==="Enter"||e.key==="Tab")){ e.preventDefault(); $("#mentSug button").click(); return; }
    if(open&&(e.key==="Enter"||e.key==="Tab")){e.preventDefault();pickSlash(S.slashSel);return;}
    if(channelOf(c)==="mail"){ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();send();} return; }
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
  });
  const subj=$("#mSubj"); if(subj) subj.addEventListener("input",()=>S.subject[c.id]=subj.value);
  $("#fileIn").addEventListener("change",e=>{ [...e.target.files].forEach(f=>S.attach.push({f:f.name,s:(f.size/1024>1024?(f.size/1048576).toFixed(1)+" MB":Math.max(1,Math.round(f.size/1024))+" KB")})); refreshComposer(); });
  if(channelOf(c)==="mail") bindMail(c);
  updateHelpers();

function updateHelpers(){
  const ta=$("#msg"); if(!ta) return; const v=ta.value;
  const sl=$("#slash"), tp=$("#taskPrev");
  const ms=$("#mentSug"); if(ms){ const c=conv(S.active); const before=v.slice(0,ta.selectionStart); const mm=before.match(/(?:^|\s)@([\p{L}.]{2,})$/u);
    ms.innerHTML= c&&channelOf(c)==="mail"&&mm ? `<div class="slash ment">${searchContacts(mm[1]).slice(0,6).map(x=>`<button data-act="mentPick" data-e="${esc(x.e)}" data-q="${esc(mm[1])}">${avatar(x.n,"#6b7a70","xs")}<span><b>${esc(x.n)}</b><small>${esc(x.e)}</small></span></button>`).join("")}</div>` : ""; if(ms.innerHTML.indexOf("button")<0) ms.innerHTML=""; }
  if(/^\/\S*$/.test(v)){ const f=SLASH.filter(s=>s[0].startsWith(v)); if(S.slashSel>=SLASH.length) S.slashSel=0;
    sl.innerHTML=f.length?`<div class="slash" role="listbox">${f.map(s=>`<button data-act="slashPick" data-i="${SLASH.indexOf(s)}" class="${SLASH.indexOf(s)===S.slashSel?"sel":""}"><code>${s[0]}</code><small>${s[1]}</small></button>`).join("")}</div>`:""; }
  else sl.innerHTML="";
  if(/^\/tarefa\s/i.test(v)){ const p=parseTask(v.replace(/^\/tarefa\s*/i,""));
    tp.innerHTML=`<div class="task-preview">${ic("task")}<span class="ttl">${esc(p.title||"Digite o título…")}</span>${p.tok.map(([i,l])=>`<span class="tk">${esc(l)}</span>`).join("")}${p.tok.some(t=>t[0]==="user")?"":`<span class="tk">Para você</span>`}<span class="muted" style="margin-left:auto">Enter cria no Foco</span></div>`; }
  else tp.innerHTML="";
}
function pickSlash(i){ const s=SLASH[i]; const c=conv(S.active);
  if(s[0]==="/proposta"){ const o=c.opp&&OPPS[c.opp]; const p=o&&o.proposals[o.proposals.length-1]; S.drafts[c.id]=""; if(p){S.attach.push({f:p.file,s:"1,3 MB",src:true});toast("chat","Proposta anexada",p.file+" (pasta 03 Propostas)");} else toast("info","Sem proposta","Essa oportunidade ainda não tem proposta."); refreshComposer(); return; }
  if(s[0]==="/modelo"){ S.drafts[c.id]=`Olá, ${c.name.split(" ")[0]}! Tudo bem? Segue o material solicitado. Qualquer dúvida estou à disposição.`; refreshComposer(); return; }
  if(s[0]==="/lote"){ S.drafts[c.id]=""; refreshComposer(); openBatch(true); return; }
  if(s[0]==="/nota"){ S.channel[c.id]="note"; S.drafts[c.id]=""; renderChat(false); $("#msg").focus(); return; }

function refreshComposer(){ const c=conv(S.active); $("#composer").classList.toggle("is-int",channelOf(c)==="int"); $("#composer").classList.toggle("is-ger",channelOf(c)==="ger"); $("#composer").innerHTML=composerHTML(c,channelOf(c)); bindComposer(c); const ta=$("#msg"); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }

const isNewFromOthers = it=> (it.t==="wa"&&it.dir==="in") || (it.t==="email"&&it.dir==="in") || it.t==="memail" || it.t==="ai" || it.t==="ai2" || ((it.t==="int"||it.t==="ger")&&it.from!==ME) || (it.t==="stage"&&it.by!==ME);
function push(c,item){ c.items.push(item); c.ts=Date.now();
  if(item.t==="memail"&&c.mission){ const nw=scanMail(c,item); if(nw.length){ announceParts(c,nw); setTimeout(()=>toast("users",`${nw.length} participante${nw.length>1?"s":""} cadastrado${nw.length>1?"s":""}`,`${nw.map(p=>p.name).join(", ")} · ${c.name.split(" - ")[0]} · já no Prisma.`),500); } } if(c.pzSync&&["email","call","meet"].includes(item.t)) item.prisma={type:"Histórico de atividade",links:prismaLinks(c).map(l=>l.k)};
  if(c.archived && isNewFromOthers(item)){ c.archived=false; const nm=c.name; setTimeout(()=>toast("bell",c.mission?"Missão voltou para Todas":"Conversa reaberta",`${nm} tem novidade e voltou para a sua lista.`),300); } }
function send(){
  const c=conv(S.active); const ta=$("#msg"); const v=ta.value.trim(); const ch=channelOf(c);
  if(/^\/tarefa\s/i.test(v)){ const p=parseTask(v.replace(/^\/tarefa\s*/i,"")); if(!p.title){toast("info","Falta o título","Escreva o que precisa ser feito depois de /tarefa.");return;} createTask(c,p); S.drafts[c.id]=""; renderAll(); return; }
  if(!v && !S.attach.length) return;
  const files=S.attach.slice(); S.attach=[]; S.drafts[c.id]="";
  if((ch==="int"||ch==="ger")&&c.mission&&/^(@ia\b|\/alerta\b)/i.test(v)){ push(c,{t:ch,from:ME,text:v,time:nowTime(),files});
    const rule=parseRule(v,ch,c); c.mission.rules=c.mission.rules||[]; c.mission.rules.push(rule);
    S.drafts[c.id]=""; renderAll(); setTimeout(()=>{ push(c,{t:"rulecard",ch:rule.ch,rule:rule.id,time:nowTime()}); renderAll(); },900); return; }
  if(ch==="int"){ push(c,{t:"int",from:ME,text:v,time:nowTime(),files}); renderAll(); return; }
  if(ch==="ger"){ push(c,{t:"ger",from:ME,text:v,time:nowTime(),files}); toast("bell","Enviado no gerencial",gerOf(c).members.filter(k=>k!==ME).map(k=>memberName(k).split(" ")[0]).join(", ")+" foram avisados."); renderAll(); return; }
  if(ch!=="note") S.replied[c.id]=true;
  if(ch==="note"){ push(c,{t:"note",by:ME,text:v,time:nowTime()}); }
  else if(ch==="mail"){ const M=mailState(c); if(!M.to.length&&!M.cc.length){ S.drafts[c.id]=v; S.attach=files; toast("info","Falta destinatário","Adicione alguém em Para."); refreshComposer(); return; }
    const subj=($("#mSubj")?.value||"").trim()||"(sem assunto)"; const ments=[...v.matchAll(/@([\p{L}]+ [\p{L}]+)/gu)].map(x=>x[1]);
    push(c,{t:"email",dir:"out",from:ME,to:M.to.join(", "),cc:M.cc.join(", "),bcc:M.bcc.join(", "),ments,sig:M.sig?ME:null,subject:subj,body:v,time:nowTime(),files}); delete S.subject[c.id]; S.mail[c.id]=null;
    toast("mail","E-mail enviado pelo Outlook","Salvo em Itens enviados e no histórico do cliente no Prisma."); }
  else { const it={t:"wa",dir:"out",text:v,time:nowTime(),status:"sent",files}; push(c,it);
    setTimeout(()=>{it.status="delivered"; if(S.active===c.id) renderChat(false);},900);
    setTimeout(()=>{it.status="read"; if(S.active===c.id) renderChat(false);},2200);
    if(c.id==="c1" && files.length && !c.replied){ c.replied=true;
      setTimeout(()=>{S.typing="c1"; if(S.active==="c1") renderChat();},2600);
      setTimeout(()=>{S.typing=null; incoming("c1",{t:"wa",dir:"in",text:"Recebi, Otávio! Era exatamente esse. Vou apresentar na reunião de terça. Obrigado!",time:nowTime()});},5200); } }
  renderAll();
}

const groupNotify = g=>(g.notify=g.notify||{done:true,created:false});
const dueTxt = t=>t.due?fmtDue(t.due)+(t.time?" às "+t.time:""):"sem data";
function waAuto(g,text){ const it={t:"wa",dir:"out",auto:true,text,time:nowTime(),status:"sent"}; push(g,it);
  setTimeout(()=>{it.status="delivered"; if(S.active===g.id) renderChat(false);},900); setTimeout(()=>{it.status="read"; if(S.active===g.id) renderChat(false);},2400); }
function notifyTaskDone(t){
  const g=groupOfTask(t); if(!g||!groupNotify(g).done) return null;
  if(t.done){ waAuto(g,`✅ *Tarefa concluída*\n${t.title}\nResponsável: ${memberName(t.who)} · concluída por ${memberName(ME).split(" ")[0]}`); t.notified=true; }
  else if(t.notified){ waAuto(g,`↩️ *Tarefa reaberta*\n${t.title}\nResponsável: ${memberName(t.who)} · prazo ${dueTxt(t)}`); }
  else return null;
  return g;
}
function notifyTasksCreated(g,list){
  if(!g||g.kind!=="group"||!groupNotify(g).created||!list.length) return false;
  waAuto(g,`📋 *${list.length>1?list.length+" novas tarefas":"Nova tarefa"} da ${g.name.split(" - ")[0]}*\n`+list.map(t=>`• ${t.title} — ${memberName(t.who).split(" ")[0]} (${dueTxt(t)})`).join("\n")); return true;
}
function createTask(c,p){
  const t={id:"t"+(uid++),title:p.title,who:p.who,due:p.due,time:p.time,prio:p.prio,done:false,conv:c.id,project:p.project||((PROJECTS.find(x=>x.conv===c.id)||{}).code)||(c.opp?OPPS[c.opp].code:null)};
  TASKS.push(t); notifyTasksCreated(groupOfTask(t),[t]);
  push(c,{t:"event",ic:"task",text:`Tarefa criada no Foco: <b>${esc(t.title)}</b> · para ${esc(memberName(t.who).split(" ")[0])}${t.due?" · "+fmtDue(t.due)+(t.time?" "+t.time:""):""}`,time:nowTime()});
  toast("task","Tarefa criada no Foco", t.who===ME?"Adicionada às suas tarefas.":memberName(t.who)+" recebeu a notificação no Foco e no celular.");
}
function incoming(id,item){ const c=conv(id); push(c,item); delete S.replied[id];

/* ---------- Toasts e modais ---------- */
function toast(icn,title,text,actions){
  const box=$("#toasts"); const t=document.createElement("div"); t.className="toast";
  const kind={chat:"wa",mail:"mail",call:"call",task:"ev",info:"ev",bell:"wa"}[icn]||"ev";
  t.innerHTML=`<span class="ch-ic ${kind}" style="width:28px;height:28px">${ic(icn==="call"?"phone":icn==="bell"?"chat":icn)}</span><div class="g"><b>${esc(title)}</b><p>${esc(text)}</p>${actions?`<div class="acts">${actions}</div>`:""}</div><button class="icon-btn" style="width:26px;height:26px" aria-label="Fechar">${ic("x")}</button>`;
  t.querySelector("button.icon-btn").onclick=()=>t.remove();
  t.addEventListener("click",e=>{ if(e.target.closest("[data-act]")) setTimeout(()=>t.remove(),50); });
  while(box.children.length>=3) box.firstElementChild.remove();
  box.appendChild(t); setTimeout(()=>t.remove(),actions?12000:4500);
}

    ["shield","Permissão por oportunidade e por linha","Cada pessoa vê só os clientes, linhas de WhatsApp e pastas do SharePoint a que tem direito. Herdamos as permissões que já existem no SharePoint."],
    ["contract","Trilha de auditoria","Quem abriu, enviou, baixou ou encaminhou cada arquivo e mensagem fica registrado e não pode ser apagado."],
    ["mic","Gravações com consentimento (LGPD)","Aviso automático no início da chamada, retenção configurável e acesso restrito ao time da oportunidade."],
    ["users","Dados dentro da Filtrovali","Mensagens, gravações e transcrições criptografadas em repouso e em trânsito, em servidor no Brasil. Nenhuma credencial fica no navegador."],
    ["bell","Alertas de risco","Envio de arquivo para fora da empresa, download em massa ou login de local estranho geram alerta para o administrador."]];
  $("#overlay").innerHTML=`<div class="overlay" data-act="closeModal"><div class="modal" role="dialog" aria-label="Segurança"><div class="modal-h">${ic("shield")}<b>Segurança e acesso</b><button class="icon-btn" data-act="closeModal" aria-label="Fechar">${ic("x")}</button></div>
    <div class="modal-b"><div class="tip">${ic("info")}<span>Neste protótipo os itens abaixo são a especificação proposta, ainda não implementada.</span></div>${items.map(([i,t,p])=>`<div class="sec-item"><span class="si">${ic(i)}</span><div><b>${t}</b><p>${p}</p></div></div>`).join("")}</div></div></div>`;
}

function openConv(id,itemIdx){
  const c=conv(id); if(!c) return; if(S.active!==id){S.attach=[];} S.active=id; c.unread=0; S.pane="chat"; if(S.view!=="chats"&&window.innerWidth>760){} renderAll();
  if(itemIdx!=null){ const el=document.querySelector(`#stream [data-i="${itemIdx}"]`); if(el){el.scrollIntoView({block:"center"});el.classList.add("highlight");} }
}

    case "closeReview": { const g=MGMT[c.id], att=reviewItems(c).filter(x=>x.st!=="ok").length; g.reviews.unshift({w:WEEK_NOW,by:ME,at:"25/10 "+nowTime(),att});

    case "openThread": threadModal(c,b.dataset.th); break;
    case "mailToInt": { const it=c.items[+b.dataset.i]; S.layer[c.id]="int"; S.channel[c.id]="int"; S.drafts[c.id]=`Sobre o e-mail “${it.subject}” (caixa da ${memberName(it.box).split(" ")[0]}): `; renderChat(); renderList(); $("#msg").focus(); break; }

/* Deslizar para concluir (celular e arrastar com mouse) */
let sw=null;
const listEl=$("#list");
listEl.addEventListener("pointerdown",e=>{ const row=e.target.closest(".row.swipeable"); if(!row||e.button>0) return;
  sw={row,id:row.dataset.id,x:e.clientX,y:e.clientY,dx:0,on:false,pid:e.pointerId}; });
listEl.addEventListener("pointermove",e=>{ if(!sw||e.pointerId!==sw.pid) return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(!sw.on){ if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ sw=null; return; } if(dx<-10&&Math.abs(dx)>Math.abs(dy)){ sw.on=true; sw.row.setPointerCapture(e.pointerId); sw.row.classList.add("dragging"); } else return; }
  sw.dx=Math.min(0,dx); sw.row.style.transform=`translateX(${sw.dx}px)`;
  sw.row.parentElement.classList.toggle("armed",-sw.dx>sw.row.offsetWidth*0.35); });
function endSwipe(){ if(!sw) return; const s=sw; sw=null; if(!s.on) return;
  swipeJustEnded=true; setTimeout(()=>swipeJustEnded=false,350);
  s.row.classList.remove("dragging");
  if(-s.dx>s.row.offsetWidth*0.35){ s.row.style.transform="translateX(-110%)"; const wrap=s.row.parentElement; wrap.style.height=wrap.offsetHeight+"px";
    setTimeout(()=>{wrap.classList.add("collapse");},180); setTimeout(()=>conclude(s.id,true),380); }
  else { s.row.style.transform=""; s.row.parentElement.classList.remove("armed"); } }
listEl.addEventListener("pointerup",endSwipe);
listEl.addEventListener("pointercancel",()=>{ if(sw&&sw.on){ sw.row.style.transform=""; sw.row.classList.remove("dragging"); } sw=null; });
