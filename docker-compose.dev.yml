# Banco local para desenvolvimento. Porta 5433 para não colidir com o filtroAPP (5432).
# Senhas fixas só porque é local; em produção vêm do .env.production (deploy/).
services:
  postgres:
    image: postgres:16-alpine
    # Desempenho (E19): estatística das consultas (pg_stat_statements, sem os valores) e log das que
    # passam de 500 ms, sem os parâmetros (podem ter dado pessoal). docs/producao/desempenho.md.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=500
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    environment:
      POSTGRES_DB: omni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      OMNI_OWNER_PASSWORD: omni_owner_dev
      OMNI_APP_PASSWORD: omni_app_dev
      OMNI_WORKER_PASSWORD: omni_worker_dev
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - omni_pg_dev:/var/lib/postgresql/data
      - ./deploy/postgres/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./deploy/postgres/dev/02-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omni"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  omni_pg_dev:
